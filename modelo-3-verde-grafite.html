<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Di_o_Trader · Diário de Trade — Verde &amp; Grafite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1511;
      --panel: #161d19;
      --panel-2: #1c2521;
      --graphite: #2b332e;
      --green: #3ddc84;
      --green-dim: #2aa863;
      --text: #d8e6dd;
      --muted: #79897f;
      --line: rgba(61,220,132,0.16);
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background:
        linear-gradient(rgba(14,21,17,0.96), rgba(14,21,17,0.96)),
        repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(61,220,132,0.04) 39px);
      color: var(--text); min-height: 100vh; padding: 36px 20px 70px;
    }
    .wrap { max-width: 1160px; margin: 0 auto; }
    .term-bar { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px 12px 0 0; padding: 12px 16px; }
    .term-bar .c { width: 11px; height: 11px; border-radius: 50%; }
    .term-bar .c1 { background: #ff6b6b; } .term-bar .c2 { background: #ffd166; } .term-bar .c3 { background: var(--green); }
    .term-bar .path { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--muted); margin-left: 8px; }
    .screen { background: var(--panel); border: 1px solid var(--line); border-top: none; border-radius: 0 0 14px 14px; padding: 30px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .brand { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: clamp(1.7rem, 4vw, 2.4rem); color: var(--green); }
    .brand .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .brand .u { color: var(--green-dim); }
    .prompt { font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-size: 0.82rem; margin-top: 6px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 26px; }
    .stat { background: var(--panel-2); border-left: 3px solid var(--green); border-radius: 8px; padding: 14px 16px; }
    .stat .k { font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .stat .v { font-family: 'IBM Plex Mono', monospace; font-size: 1.4rem; color: var(--green); margin-top: 6px; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; min-width: 1040px; font-family: 'IBM Plex Mono', monospace; }
    th { text-align: left; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); background: var(--panel-2); padding: 12px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 6px 10px; border-bottom: 1px solid rgba(61,220,132,0.08); }
    td input, td select, td textarea { width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 7px 7px; outline: none; }
    td input::placeholder { color: #4d5a52; }
    td input:hover, td select:hover, td textarea:hover { border-color: rgba(61,220,132,0.25); }
    td input:focus, td select:focus, td textarea:focus { background: #0e1511; border-color: var(--green); }
    td textarea { resize: vertical; min-height: 34px; }
    td select option { background: var(--panel); }
    .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; cursor: pointer; border-radius: 8px; padding: 10px 16px; background: var(--green); border: none; color: #0e1511; font-weight: 600; transition: filter 0.15s; }
    .btn:hover { filter: brightness(1.12); }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--green); }
    .btn.ghost:hover { background: var(--panel-2); }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 30px; font-family: 'IBM Plex Mono', monospace; }
    footer a { color: var(--green); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="term-bar"><span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="path">~/di_o_trader/journal.log</span></div>
    <div class="screen">
      <header>
        <div>
          <div class="brand">Di<span class="u">_</span>o<span class="u">_</span>Trader<span class="caret">_</span></div>
          <div class="prompt">$ registrar operações do dia</div>
        </div>
        <input type="date" style="font-family:'IBM Plex Mono',monospace;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;" />
      </header>

      <section class="stats">
        <div class="stat"><div class="k">trades</div><div class="v">00</div></div>
        <div class="stat"><div class="k">wins</div><div class="v">00</div></div>
        <div class="stat"><div class="k">win_rate</div><div class="v">--%</div></div>
        <div class="stat"><div class="k">net_R</div><div class="v">+0.0</div></div>
      </section>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>data</th><th>ativo</th><th>tipo</th><th>entrada</th><th>saída</th>
              <th>size</th><th>stop</th><th>alvo</th><th>resultado</th>
              <th>setup</th><th>psico</th><th>obs / lições</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="actions">
        <button class="btn" id="addRow">+ nova_linha</button>
        <button class="btn ghost" onclick="window.print()">export_pdf</button>
      </div>
    </div>
    <footer>// Di_o_Trader · <a href="index.html">cd ../modelos</a></footer>
  </div>

  <template id="rowTpl">
    <tr>
      <td><input type="date" /></td>
      <td><input type="text" placeholder="PETR4" /></td>
      <td><select><option value="">--</option><option>Long</option><option>Short</option></select></td>
      <td><input type="number" step="any" placeholder="0.00" /></td>
      <td><input type="number" step="any" placeholder="0.00" /></td>
      <td><input type="text" placeholder="100" /></td>
      <td><input type="number" step="any" placeholder="0.00" /></td>
      <td><input type="number" step="any" placeholder="0.00" /></td>
      <td><input type="text" placeholder="+1.5R" /></td>
      <td><input type="text" placeholder="breakout" /></td>
      <td><select><option value="">--</option><option>calmo</option><option>confiante</option><option>ansioso</option><option>impaciente</option><option>fomo</option><option>disciplinado</option></select></td>
      <td><textarea placeholder="lição do trade"></textarea></td>
    </tr>
  </template>

  <script>
    var tpl = document.getElementById('rowTpl');
    var tbody = document.getElementById('tbody');
    function addRow() { tbody.appendChild(tpl.content.cloneNode(true)); }
    document.getElementById('addRow').addEventListener('click', addRow);
    addRow(); addRow(); addRow();
  </script>
</body>
</html>
