<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Di_o_Trader · Diário de Trade — Vermelho &amp; Branco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #fbfbfc;
      --red: #e01e37;
      --red-soft: #ff5a72;
      --text: #1a1c1f;
      --muted: #7a7f88;
      --line: #eceef1;
      --green: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 85% -8%, rgba(224,30,55,0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px 70px;
      line-height: 1.5;
    }
    .wrap { max-width: 1140px; margin: 0 auto; }
    .topline { height: 3px; width: 64px; background: var(--red); border-radius: 3px; margin-bottom: 30px; }
    header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 34px; }
    .brand { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: clamp(1.9rem, 4.5vw, 2.8rem); letter-spacing: -0.01em; color: var(--text); }
    .brand .u { color: var(--red); opacity: 0.85; }
    .sub { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.22em; text-transform: uppercase; margin-top: 6px; }
    .date-field { text-align: right; }
    .date-field label { display: block; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
    input, select, textarea {
      font-family: inherit; font-size: 0.92rem; color: var(--text);
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
      padding: 9px 12px; outline: none; transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--red); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 34px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
    .stat .k { color: var(--muted); font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .stat .v { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.6rem; margin-top: 8px; color: var(--red); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(16,24,40,0.05); }
    .panel-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.01em; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1050px; }
    th { text-align: left; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 14px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td input, td select, td textarea { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 7px 8px; }
    td input:hover, td select:hover, td textarea:hover { border-color: rgba(224,30,55,0.25); }
    td input:focus, td select:focus, td textarea:focus { background: var(--panel-2); border-color: var(--red); }
    td textarea { resize: vertical; min-height: 38px; }
    .actions { padding: 18px 22px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { font-family: inherit; font-size: 0.86rem; font-weight: 500; letter-spacing: 0.02em; cursor: pointer; border-radius: 8px; padding: 10px 18px; border: 1px solid var(--red); background: var(--red); color: #fff; transition: all 0.15s; }
    .btn:hover { background: #c01830; border-color: #c01830; }
    .btn.ghost { border-color: var(--line); color: var(--muted); background: transparent; }
    .btn.ghost:hover { background: var(--panel-2); color: var(--text); }
    footer { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 36px; }
    footer a { color: var(--red); text-decoration: none; }
    @media (max-width: 640px) { header { flex-direction: column; align-items: flex-start; } .date-field { text-align: left; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topline"></div>
    <header>
      <div>
        <div class="brand">Di<span class="u">_</span>o<span class="u">_</span>Trader</div>
        <div class="sub">Diário de Trade · Edição Minimal</div>
      </div>
      <div class="date-field">
        <label for="d1">Período</label>
        <input type="month" id="d1" />
      </div>
    </header>

    <section class="stats">
      <div class="stat"><div class="k">Total de Trades</div><div class="v">0</div></div>
      <div class="stat"><div class="k">Taxa de Acerto</div><div class="v">—</div></div>
      <div class="stat"><div class="k">Resultado (R)</div><div class="v">0.0</div></div>
      <div class="stat"><div class="k">Melhor Setup</div><div class="v">—</div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="dot"></span><h2>Registro de Operações</h2></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Ativo / Par</th><th>Tipo</th><th>Entrada</th><th>Saída</th>
              <th>Tamanho</th><th>Stop</th><th>Alvo</th><th>Resultado</th>
              <th>Setup / Estratégia</th><th>Psicológico</th><th>Observações / Lições</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="date" /></td>
              <td><input type="text" placeholder="BTC/USDT" /></td>
              <td><select><option value="">—</option><option>Compra / Long</option><option>Venda / Short</option></select></td>
              <td><input type="number" step="any" placeholder="0,00" /></td>
              <td><input type="number" step="any" placeholder="0,00" /></td>
              <td><input type="text" placeholder="0,5 lote" /></td>
              <td><input type="number" step="any" placeholder="0,00" /></td>
              <td><input type="number" step="any" placeholder="0,00" /></td>
              <td><input type="text" placeholder="+1,8R" /></td>
              <td><input type="text" placeholder="Rompimento" /></td>
              <td><select><option value="">—</option><option>Calmo</option><option>Confiante</option><option>Ansioso</option><option>Impaciente</option><option>FOMO</option><option>Disciplinado</option></select></td>
              <td><textarea placeholder="O que deu certo? O que repetir ou evitar?"></textarea></td>
            </tr>
            <tr>
              <td><input type="date" /></td>
              <td><input type="text" /></td>
              <td><select><option value="">—</option><option>Compra / Long</option><option>Venda / Short</option></select></td>
              <td><input type="number" step="any" /></td>
              <td><input type="number" step="any" /></td>
              <td><input type="text" /></td>
              <td><input type="number" step="any" /></td>
              <td><input type="number" step="any" /></td>
              <td><input type="text" /></td>
              <td><input type="text" /></td>
              <td><select><option value="">—</option><option>Calmo</option><option>Confiante</option><option>Ansioso</option><option>Impaciente</option><option>FOMO</option><option>Disciplinado</option></select></td>
              <td><textarea></textarea></td>
            </tr>
            <tr>
              <td><input type="date" /></td>
              <td><input type="text" /></td>
              <td><select><option value="">—</option><option>Compra / Long</option><option>Venda / Short</option></select></td>
              <td><input type="number" step="any" /></td>
              <td><input type="number" step="any" /></td>
              <td><input type="text" /></td>
              <td><input type="number" step="any" /></td>
              <td><input type="number" step="any" /></td>
              <td><input type="text" /></td>
              <td><input type="text" /></td>
              <td><select><option value="">—</option><option>Calmo</option><option>Confiante</option><option>Ansioso</option><option>Impaciente</option><option>FOMO</option><option>Disciplinado</option></select></td>
              <td><textarea></textarea></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="actions">
        <button class="btn" id="addRow">+ Nova operação</button>
        <button class="btn ghost" onclick="window.print()">Imprimir / PDF</button>
      </div>
    </section>

    <footer>Di_o_Trader · <a href="index.html">voltar aos modelos</a></footer>
  </div>

  <script>
    document.getElementById('addRow').addEventListener('click', function () {
      var tbody = document.querySelector('tbody');
      var first = tbody.querySelector('tr');
      var clone = first.cloneNode(true);
      clone.querySelectorAll('input, textarea').forEach(function (el) { el.value = ''; });
      clone.querySelectorAll('select').forEach(function (el) { el.selectedIndex = 0; });
      tbody.appendChild(clone);
    });
  </script>
</body>
</html>
