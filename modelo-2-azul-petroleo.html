<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Di_o_Trader · Diário de Trade — Azul Petróleo &amp; Branco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef3f5;
      --card: #ffffff;
      --ink: #0d3b45;
      --teal: #0d8a9b;
      --teal-2: #2ec4b6;
      --text: #1d3640;
      --muted: #6b8591;
      --line: #dbe6ea;
      --green: #1f9d6b;
      --red: #d6455d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 70px;
    }
    .hero {
      background: linear-gradient(135deg, var(--ink), var(--teal));
      color: #fff; padding: 46px 24px 70px; position: relative; overflow: hidden;
    }
    .hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: rgba(46,196,182,0.25); }
    .wrap { max-width: 1080px; margin: 0 auto; }
    .hero .wrap { position: relative; z-index: 1; }
    .brand { font-weight: 800; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.02em; }
    .brand .u { opacity: 0.5; }
    .sub { opacity: 0.85; margin-top: 8px; letter-spacing: 0.06em; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 30px; }
    .stat { background: rgba(255,255,255,0.12); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.22); border-radius: 14px; padding: 16px 18px; }
    .stat .k { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
    .stat .v { font-size: 1.7rem; font-weight: 800; margin-top: 6px; }
    .board { margin-top: -40px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .toolbar h2 { color: var(--ink); font-size: 1.15rem; }
    .btn { font-family: inherit; font-weight: 600; font-size: 0.86rem; cursor: pointer; border-radius: 10px; padding: 11px 18px; border: none; background: var(--teal); color: #fff; transition: transform 0.12s, background 0.15s; }
    .btn:hover { background: var(--ink); transform: translateY(-1px); }
    .btn.ghost { background: #fff; color: var(--teal); border: 1px solid var(--line); }
    .btn.ghost:hover { background: #f3f8f9; color: var(--ink); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
    .trade { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 10px 30px rgba(13,59,69,0.06); }
    .trade-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .pair { font-weight: 700; color: var(--ink); font-size: 1.05rem; }
    .pair input { border: none; font: inherit; color: var(--ink); width: 130px; }
    .pair input::placeholder { color: var(--muted); font-weight: 500; }
    .type-pill { display: inline-flex; align-items: center; }
    .type-pill select { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.78rem; font-weight: 600; color: var(--teal); background: #f1f8f9; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    input, select, textarea { width: 100%; font-family: inherit; font-size: 0.9rem; color: var(--text); background: #f7fafb; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: none; transition: border-color 0.15s, background 0.15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--teal-2); background: #fff; }
    textarea { resize: vertical; min-height: 54px; }
    .result-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; padding-top: 14px; border-top: 1px dashed var(--line); }
    .result-row .v { font-weight: 800; font-size: 1.05rem; }
    footer { text-align: center; color: var(--muted); font-size: 0.84rem; margin-top: 40px; }
    footer a { color: var(--teal); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <div class="brand">Di<span class="u">_</span>o<span class="u">_</span>Trader</div>
      <div class="sub">Diário de Trade · Visual Petróleo</div>
      <div class="stats">
        <div class="stat"><div class="k">Trades no mês</div><div class="v">0</div></div>
        <div class="stat"><div class="k">Win rate</div><div class="v">—</div></div>
        <div class="stat"><div class="k">P&amp;L líquido</div><div class="v">R$ 0</div></div>
        <div class="stat"><div class="k">Melhor par</div><div class="v">—</div></div>
      </div>
    </div>
  </div>

  <div class="wrap board">
    <div class="toolbar">
      <h2>Operações registradas</h2>
      <div>
        <button class="btn ghost" onclick="window.print()">Imprimir</button>
        <button class="btn" id="addCard">+ Nova operação</button>
      </div>
    </div>

    <div class="cards" id="cards">
      <!-- card template rendered by JS below; one starter card inline -->
    </div>

    <footer>Di_o_Trader · <a href="index.html">voltar aos modelos</a></footer>
  </div>

  <template id="tradeTpl">
    <div class="trade">
      <div class="trade-top">
        <div class="pair"><input type="text" placeholder="EUR/USD" aria-label="Ativo ou par" /></div>
        <div class="type-pill"><select aria-label="Tipo"><option value="">Tipo</option><option>Compra / Long</option><option>Venda / Short</option></select></div>
      </div>
      <div class="fields">
        <div class="field"><label>Data</label><input type="date" /></div>
        <div class="field"><label>Tamanho da posição</label><input type="text" placeholder="1,0 lote" /></div>
        <div class="field"><label>Preço de entrada</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field"><label>Preço de saída</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field"><label>Stop</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field"><label>Alvo</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field full"><label>Setup / Estratégia</label><input type="text" placeholder="Pullback em média móvel" /></div>
        <div class="field"><label>Estado emocional</label>
          <select><option value="">—</option><option>Calmo</option><option>Confiante</option><option>Ansioso</option><option>Impaciente</option><option>FOMO</option><option>Disciplinado</option></select>
        </div>
        <div class="field"><label>Resultado</label><input type="text" placeholder="+R$ 320 · +1,5R" /></div>
        <div class="field full"><label>Observações / Lições aprendidas</label><textarea placeholder="Segui o plano? O que melhorar na próxima?"></textarea></div>
      </div>
    </div>
  </template>

  <script>
    var tpl = document.getElementById('tradeTpl');
    var cards = document.getElementById('cards');
    function addCard() { cards.appendChild(tpl.content.cloneNode(true)); }
    document.getElementById('addCard').addEventListener('click', addCard);
    addCard(); addCard();
  </script>
</body>
</html>
