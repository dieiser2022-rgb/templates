<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Di_o_Trader · Diário de Trade — Bege &amp; Marrom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e9e0cf;
      --paper: #f7f1e3;
      --ink: #3a2a1a;
      --brown: #8a5a34;
      --brown-dk: #5e3c22;
      --tan: #c9a36a;
      --muted: #8a7a63;
      --line: #d8c7a6;
      --green: #4f7a43;
      --red: #a8442f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lora', Georgia, serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(201,163,106,0.18), transparent 40%),
        var(--bg);
      color: var(--ink); min-height: 100vh; padding: 40px 20px 70px;
    }
    .book {
      max-width: 1000px; margin: 0 auto; background: var(--paper);
      border: 1px solid var(--line); border-radius: 6px;
      box-shadow: 0 20px 50px rgba(94,60,34,0.18);
      position: relative; overflow: hidden;
      background-image: repeating-linear-gradient(transparent, transparent 37px, rgba(138,90,52,0.07) 38px);
    }
    .spine { position: absolute; top: 0; bottom: 0; left: 44px; width: 2px; background: rgba(168,68,47,0.35); }
    .spine::after { content: ""; position: absolute; left: -44px; top: 0; bottom: 0; width: 44px; background: linear-gradient(90deg, rgba(138,90,52,0.14), transparent); }
    .inner { padding: 44px 44px 44px 74px; }
    header { border-bottom: 2px solid var(--brown); padding-bottom: 20px; margin-bottom: 28px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
    .brand { font-family: 'Playfair Display', serif; font-weight: 800; font-size: clamp(2rem, 5vw, 3rem); color: var(--brown-dk); letter-spacing: 0.01em; }
    .brand .u { color: var(--tan); }
    .sub { font-style: italic; color: var(--muted); margin-top: 4px; }
    .date-field label { display: block; font-family: 'Playfair Display', serif; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brown); margin-bottom: 6px; }
    input, select, textarea { font-family: 'Lora', serif; font-size: 0.95rem; color: var(--ink); background: rgba(255,255,255,0.4); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; outline: none; transition: border-color 0.15s, background 0.15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--brown); background: #fff; }
    .entry { border: 1px solid var(--line); border-left: 4px solid var(--tan); border-radius: 4px; background: rgba(255,255,255,0.35); padding: 22px; }
    .entry + .entry { margin-top: 22px; }
    .entry-head { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--brown-dk); font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .entry-head .no { width: 30px; height: 30px; border-radius: 50%; background: var(--brown); color: var(--paper); display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; }
    .fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 16px; }
    .field.span2 { grid-column: span 2; } .field.full { grid-column: 1 / -1; }
    label { display: block; font-family: 'Playfair Display', serif; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brown); margin-bottom: 5px; }
    input, select, textarea { width: 100%; }
    textarea { resize: vertical; min-height: 52px; font-style: italic; }
    .actions { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .btn { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; border-radius: 4px; padding: 11px 22px; border: 1px solid var(--brown); background: var(--brown); color: var(--paper); transition: background 0.15s; }
    .btn:hover { background: var(--brown-dk); }
    .btn.ghost { background: transparent; color: var(--brown); }
    .btn.ghost:hover { background: rgba(138,90,52,0.08); }
    footer { text-align: center; color: var(--muted); font-style: italic; margin-top: 28px; }
    footer a { color: var(--brown); }
    @media (max-width: 680px) { .inner { padding: 30px 22px 30px 44px; } .fields { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="book">
    <div class="spine"></div>
    <div class="inner">
      <header>
        <div>
          <div class="brand">Di<span class="u">_</span>o<span class="u">_</span>Trader</div>
          <div class="sub">Diário de operações · caderno do trader</div>
        </div>
        <div class="date-field">
          <label for="d5">Dia</label>
          <input type="date" id="d5" />
        </div>
      </header>

      <div id="entries"></div>

      <div class="actions">
        <button class="btn" id="addEntry">+ Nova anotação</button>
        <button class="btn ghost" onclick="window.print()">Imprimir página</button>
      </div>

      <footer>Di_o_Trader · <a href="index.html">voltar aos modelos</a></footer>
    </div>
  </div>

  <template id="tpl">
    <div class="entry">
      <div class="entry-head"><span class="no">#</span> Operação</div>
      <div class="fields">
        <div class="field span2"><label>Ativo / Par</label><input type="text" placeholder="Ouro · XAU/USD" /></div>
        <div class="field"><label>Tipo</label><select><option value="">—</option><option>Compra / Long</option><option>Venda / Short</option></select></div>
        <div class="field"><label>Tamanho</label><input type="text" placeholder="1 contrato" /></div>
        <div class="field"><label>Entrada</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field"><label>Saída</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field"><label>Stop</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field"><label>Alvo</label><input type="number" step="any" placeholder="0,00" /></div>
        <div class="field span2"><label>Setup / Estratégia</label><input type="text" placeholder="Tendência diária" /></div>
        <div class="field"><label>Resultado</label><input type="text" placeholder="+R$ 450" /></div>
        <div class="field"><label>Estado emocional</label>
          <select><option value="">—</option><option>Calmo</option><option>Confiante</option><option>Ansioso</option><option>Impaciente</option><option>FOMO</option><option>Disciplinado</option></select>
        </div>
        <div class="field full"><label>Observações &amp; lições aprendidas</label><textarea placeholder="Querido diário, neste trade eu..."></textarea></div>
      </div>
    </div>
  </template>

  <script>
    var tpl = document.getElementById('tpl');
    var entries = document.getElementById('entries');
    var count = 0;
    function addEntry() {
      var node = tpl.content.cloneNode(true);
      count += 1;
      node.querySelector('.no').textContent = count;
      entries.appendChild(node);
    }
    document.getElementById('addEntry').addEventListener('click', addEntry);
    addEntry(); addEntry();
  </script>
</body>
</html>
